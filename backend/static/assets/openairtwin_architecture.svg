<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="archTitleLight archDescLight">
  <title id="archTitleLight">OpenAirTwin System Architecture</title>
  <desc id="archDescLight">Three-column architecture diagram showing Browser Workbench, Python Backend, and Simulation Runtime layers with equal-height module cards and REST/JSON and RT/Scene interfaces.</desc>
  <style>
    .col-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      fill: #57606a;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #1f2328;
    }
    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      fill: #656d76;
    }
    .edge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #57606a;
    }
  </style>

  <!-- Column 1: Browser Workbench -->
  <rect x="16" y="16" width="256" height="284" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="36" cy="37" r="3.5" fill="#0969da"/>
  <text x="47" y="41" class="col-header">BROWSER WORKBENCH</text>
  <line x1="30" y1="58" x2="258" y2="58" stroke="#d8dee4" stroke-width="1"/>

  <rect x="30" y="74" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="144" y="100" text-anchor="middle" class="card-title">React + Astryx UI</text>
  <text x="144" y="118" text-anchor="middle" class="card-sub">Inspector · Controls · Charts</text>

  <rect x="30" y="148" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="144" y="174" text-anchor="middle" class="card-title">Feature Runtime</text>
  <text x="144" y="192" text-anchor="middle" class="card-sub">State · Picking · Renderers</text>

  <rect x="30" y="222" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="144" y="248" text-anchor="middle" class="card-title">3D &amp; Map Viewports</text>
  <text x="144" y="266" text-anchor="middle" class="card-sub">Three.js · MapLibre GL</text>

  <!-- Column 2: Python Backend -->
  <rect x="352" y="16" width="256" height="284" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="372" cy="37" r="3.5" fill="#6366f1"/>
  <text x="383" y="41" class="col-header">PYTHON BACKEND</text>
  <line x1="366" y1="58" x2="594" y2="58" stroke="#d8dee4" stroke-width="1"/>

  <rect x="366" y="74" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="100" text-anchor="middle" class="card-title">HTTP Server &amp; Loader</text>
  <text x="480" y="118" text-anchor="middle" class="card-sub">server.py · workbench.py</text>

  <rect x="366" y="148" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="174" text-anchor="middle" class="card-title">Feature Services</text>
  <text x="480" y="192" text-anchor="middle" class="card-sub">REST Routes · Validation</text>

  <rect x="366" y="222" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="248" text-anchor="middle" class="card-title">Async Job Workers</text>
  <text x="480" y="266" text-anchor="middle" class="card-sub">In-Process · DeepMIMO · Radar</text>

  <!-- Column 3: Simulation Runtime -->
  <rect x="688" y="16" width="256" height="284" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="708" cy="37" r="3.5" fill="#0f766e"/>
  <text x="719" y="41" class="col-header">SIMULATION RUNTIME</text>
  <line x1="702" y1="58" x2="930" y2="58" stroke="#d8dee4" stroke-width="1"/>

  <rect x="702" y="74" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="816" y="100" text-anchor="middle" class="card-title">Sionna RT 2.2.0</text>
  <text x="816" y="118" text-anchor="middle" class="card-sub">PathSolver · RCSSolver</text>

  <rect x="702" y="148" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="816" y="174" text-anchor="middle" class="card-title">3D Scene &amp; Tile Core</text>
  <text x="816" y="192" text-anchor="middle" class="card-sub">Open3Dhk Meshes · Scene XML</text>

  <rect x="702" y="222" width="228" height="60" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="816" y="248" text-anchor="middle" class="card-title">Compute Backends</text>
  <text x="816" y="266" text-anchor="middle" class="card-sub">NVIDIA CUDA · LLVM CPU</text>

  <!-- Bidirectional Connectors (aligned to Row 2 midline y=178) -->
  <line x1="285" y1="178" x2="339" y2="178" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="278,178 286,174 286,182" fill="#8c959f"/>
  <polygon points="346,178 338,174 338,182" fill="#8c959f"/>
  <text x="312" y="165" text-anchor="middle" class="edge-label">REST / JSON</text>

  <line x1="621" y1="178" x2="675" y2="178" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="614,178 622,174 622,182" fill="#8c959f"/>
  <polygon points="682,178 674,174 674,182" fill="#8c959f"/>
  <text x="648" y="165" text-anchor="middle" class="edge-label">RT / Scene</text>
</svg>
