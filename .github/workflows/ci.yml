name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OAT_RELEASE_VERSION: 1.1.0
  OAT_GIT_COMMIT: ${{ github.sha }}

jobs:
  workbench:
    name: Workbench quality and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Setup npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Install Workbench dependencies
        working-directory: workbench
        run: npm ci

      - name: Run TypeScript, lint and formatting gates
        working-directory: workbench
        run: npm run check

      - name: Run Workbench unit tests
        working-directory: workbench
        run: npm run test:unit

      - name: Build and verify the production Workbench
        working-directory: workbench
        run: npm run build

      - name: Upload the immutable Workbench
        uses: actions/upload-artifact@v4
        with:
          name: openairtwin-workbench-${{ github.sha }}
          path: backend/static/workbench
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  python-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    needs: workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the tested Workbench
        uses: actions/download-artifact@v5
        with:
          name: openairtwin-workbench-${{ github.sha }}
          path: backend/static/workbench

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q backend install.py tools

      - name: Run the complete Python suite
        run: python -m pytest tests

  dependency-audit:
    name: Security and license audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install audit dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            workbench/package-lock.json
            website/package-lock.json
            tests/browser/package-lock.json

      - name: Setup npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Install all npm workspaces
        run: |
          npm --prefix workbench ci
          npm --prefix website ci
          npm --prefix tests/browser ci

      - name: Audit Python runtime dependencies
        run: |
          mkdir -p dist/audit
          python -m pip_audit --requirement requirements.txt --format json --output dist/audit/python.json

      - name: Audit npm lockfiles
        run: |
          npm --prefix workbench audit --audit-level=high --json > dist/audit/workbench-npm.json
          npm --prefix website audit --audit-level=high --json > dist/audit/website-npm.json
          npm --prefix tests/browser audit --audit-level=high --json > dist/audit/browser-npm.json

      - name: Audit licenses and vendored runtime libraries
        run: python tools/audit_release_dependencies.py --report dist/audit/dependencies.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openairtwin-audit-${{ github.sha }}
          path: dist/audit
          if-no-files-found: warn
          retention-days: 14

  real-runtime-smoke:
    name: Real runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OAT_RUN_REAL_RUNTIME_TESTS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Prepare runtime caches
        run: mkdir -p "$RUNNER_TEMP/matplotlib"

      - name: Diagnose runtime
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python install.py --doctor

      - name: Run real runtime smoke tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -p "test_real_runtime.py" -v

  tutorial-site:
    name: Tutorial contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Install tutorial dependencies
        working-directory: website
        run: npm ci

      - name: Test and build the tutorial
        working-directory: website
        run: npm test && npm run build

  browser-contracts:
    name: Browser feature contracts
    runs-on: ubuntu-latest
    needs: workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the tested Workbench
        uses: actions/download-artifact@v5
        with:
          name: openairtwin-workbench-${{ github.sha }}
          path: backend/static/workbench

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            tests/browser/package-lock.json
            website/package-lock.json
            workbench/package-lock.json

      - name: Setup npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Install browser dependencies
        working-directory: tests/browser
        run: npm ci

      - name: Install Workbench dependencies
        working-directory: workbench
        run: npm ci

      - name: Install tutorial dependencies
        working-directory: website
        run: npm ci

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser contracts
        working-directory: tests/browser
        run: npm run test:ci

      - name: Run interactive tutorial contracts
        working-directory: tests/browser
        run: npm run test:tutorial-site

  release-package:
    name: Deterministic release package
    runs-on: ubuntu-latest
    needs:
      - workbench
      - python-tests
      - dependency-audit
      - browser-contracts
      - real-runtime-smoke
      - tutorial-site
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the tested Workbench
        uses: actions/download-artifact@v5
        with:
          name: openairtwin-workbench-${{ github.sha }}
          path: backend/static/workbench

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the first release archive
        run: >-
          python tools/build_release.py
          --version "$OAT_RELEASE_VERSION"
          --git-commit "$OAT_GIT_COMMIT"
          --output-dir dist/release-first

      - name: Build the second release archive
        run: >-
          python tools/build_release.py
          --version "$OAT_RELEASE_VERSION"
          --git-commit "$OAT_GIT_COMMIT"
          --output-dir dist/release-second

      - name: Verify byte-for-byte reproducibility
        run: >-
          cmp
          dist/release-first/openairtwin-1.1.0.tar.gz
          dist/release-second/openairtwin-1.1.0.tar.gz

      - name: Enforce English release content
        run: >-
          python tools/check_release_english.py
          --archive dist/release-first/openairtwin-1.1.0.tar.gz

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: openairtwin-1.1.0-${{ github.sha }}
          path: dist/release-first
          if-no-files-found: error
          retention-days: 14

  clean-install:
    name: Clean application install
    runs-on: ubuntu-latest
    needs: release-package
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the release artifact
        uses: actions/download-artifact@v5
        with:
          name: openairtwin-1.1.0-${{ github.sha }}
          path: dist/release

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and smoke-test the packaged application
        run: python tools/smoke_release_archive.py dist/release/openairtwin-1.1.0.tar.gz
